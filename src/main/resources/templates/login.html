<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 数据库导出工具</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <ellipse cx="12" cy="5" rx="9" ry="3"/>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
            </div>
            <h1 class="login-title">数据库导出工具</h1>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" class="input" id="username" placeholder="请输入用户名" value="admin" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" class="input" id="password" placeholder="请输入密码" value="123456" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;justify-content:center;margin-top:8px;">登 录</button>
            </form>
            <p class="login-hint">默认账号: admin / 123456</p>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) { showToast('error', '登录失败', '请输入用户名和密码'); return; }
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 登录中...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if (data.success) {
                    showToast('success', '登录成功', '正在跳转...');
                    setTimeout(() => window.location.href = '/index.html', 500);
                } else {
                    showToast('error', '登录失败', data.message);
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            } catch (err) {
                showToast('error', '登录失败', '网络错误');
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        });

        function escapeHtml(str) { const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            const icons = {success: '✓', error: '✗', warning: '⚠', info: 'ℹ'};
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]||''}</span><div class="toast-content"><div class="toast-title">${escapeHtml(title)}</div>${message ? `<div class="toast-message">${escapeHtml(message)}</div>` : ''}</div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }
    </script>
</body>
</html>
