<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库导出工具 V2.0 - 登录</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换主题">
        <svg id="sunIcon" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="moonIcon" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <main class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <h1 class="login-title">数据库导出工具 V2.0</h1>
                <p class="login-subtitle">Database Export Tool</p>
            </div>

            <div id="errorMsg" class="login-error" hidden></div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="用户名"
                        autocomplete="username"
                        required
                        autofocus>
                </div>
                <div class="form-group">
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="密码"
                        autocomplete="current-password"
                        required>
                </div>
                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="btnText">登 录</span>
                    <span id="btnLoading" class="btn-loading" hidden>
                        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke-dasharray="31.416" stroke-dashoffset="10" stroke-linecap="round"/>
                        </svg>
                        登录中...
                    </span>
                </button>
            </form>

            <p class="login-hint">默认账号: admin / 123456</p>
        </div>
    </main>

    <script>
        (function () {
            var STORAGE_KEY = 'theme';
            var LIGHT = 'light';
            var DARK = 'dark';

            var html = document.documentElement;
            var themeToggle = document.getElementById('themeToggle');
            var sunIcon = document.getElementById('sunIcon');
            var moonIcon = document.getElementById('moonIcon');
            var loginForm = document.getElementById('loginForm');
            var usernameInput = document.getElementById('username');
            var passwordInput = document.getElementById('password');
            var loginBtn = document.getElementById('loginBtn');
            var btnText = document.getElementById('btnText');
            var btnLoading = document.getElementById('btnLoading');
            var errorMsg = document.getElementById('errorMsg');

            function getTheme() {
                var stored = localStorage.getItem(STORAGE_KEY);
                if (stored === DARK || stored === LIGHT) return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT;
            }

            function applyTheme(theme) {
                html.setAttribute('data-theme', theme);
                sunIcon.style.display = theme === DARK ? '' : 'none';
                moonIcon.style.display = theme === DARK ? 'none' : '';
                localStorage.setItem(STORAGE_KEY, theme);
            }

            function toggleTheme() {
                var current = html.getAttribute('data-theme');
                applyTheme(current === DARK ? LIGHT : DARK);
            }

            function showError(message) {
                errorMsg.textContent = message;
                errorMsg.hidden = false;
            }

            function hideError() {
                errorMsg.textContent = '';
                errorMsg.hidden = true;
            }

            function setLoading(loading) {
                if (loading) {
                    loginBtn.disabled = true;
                    btnText.hidden = true;
                    btnLoading.hidden = false;
                } else {
                    loginBtn.disabled = false;
                    btnText.hidden = false;
                    btnLoading.hidden = true;
                }
            }

            function handleLogin(event) {
                event.preventDefault();
                hideError();

                var username = usernameInput.value.trim();
                var password = passwordInput.value;

                if (!username || !password) {
                    showError('请输入用户名和密码');
                    if (!username) usernameInput.focus();
                    else passwordInput.focus();
                    return;
                }

                setLoading(true);

                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/login', true);
                xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

                xhr.onload = function () {
                    setLoading(false);
                    if (xhr.status === 200) {
                        window.location.href = '/index';
                    } else {
                        var message = '登录失败，请检查用户名和密码';
                        try {
                            var resp = JSON.parse(xhr.responseText);
                            if (resp.message) message = resp.message;
                        } catch (_) {}
                        showError(message);
                    }
                };

                xhr.onerror = function () {
                    setLoading(false);
                    showError('网络错误，请检查网络连接');
                };

                xhr.send(JSON.stringify({ username: username, password: password }));
            }

            applyTheme(getTheme());
            themeToggle.addEventListener('click', toggleTheme);
            loginForm.addEventListener('submit', handleLogin);
        })();
    </script>
</body>
</html>
