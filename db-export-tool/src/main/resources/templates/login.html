<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库导出工具 - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card card">
            <div class="login-logo">📊 数据库导出工具</div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="label">用户名</label>
                    <input type="text" id="username" class="input" placeholder="请输入用户名" value="admin">
                </div>
                <div class="form-group">
                    <label class="label">密码</label>
                    <input type="password" id="password" class="input" placeholder="请输入密码" value="123456">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">
                    登 录
                </button>
            </form>
            <div class="text-muted text-small" style="margin-top:16px;">
                默认账号：admin / 123456
            </div>
        </div>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
